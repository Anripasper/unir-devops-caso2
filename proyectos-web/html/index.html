<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #e8f5e9;
      color: #33691e;
      margin: 0;
      padding: 4rem 1.5rem;
    }
    .tarjeta {
      max-width: 620px;
      margin: auto;
      background: #ffffff;
      border: 2px solid #c5e1a5;
      border-radius: 18px;
      padding: 2.5rem;
      text-align: center;
    }
    h1 {
      color: #7cb342;
      font-size: 2.4rem;
      margin: 0 0 1.5rem 0;
      letter-spacing: 2px;
    }
    ul {
      list-style: none;
      padding: 0;
      text-align: left;
    }
    li {
      background: #f1f8e9;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin: .8rem 0;
    }
    footer {
      margin-top: 2rem;
      font-size: .8rem;
      color: #9ccc65;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>Proyectos</h1>
    <ul>
      <li>Despliegue automatizado en Azure con Terraform y Ansible.</li>
      <li>Página web personal servida con Nginx sobre un contenedor.</li>
      <li>Aplicación en Kubernetes con almacenamiento persistente.</li>
     
    </ul>
    <footer>caso 2 UNIR</footer>
  </div>
</body>
</html>
